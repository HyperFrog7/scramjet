<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Drift Proxy">
	<title>Drift Proxy</title>
	<defs>
		<linearGradient id="drift" x1="0" y1="0" x2="0.72" y2="1" gradientUnits="objectBoundingBox">
			<stop offset="0" stop-color="#0b5cff" />
			<stop offset="1" stop-color="#3fa9ff" />
		</linearGradient>
		<clipPath id="tile">
